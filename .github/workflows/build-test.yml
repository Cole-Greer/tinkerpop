name: build-test
on: [push, pull_request]
jobs:
  docker-build:
    name: docker build
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Build with Docker
        run: ./docker/build.sh --tests --integration-tests
